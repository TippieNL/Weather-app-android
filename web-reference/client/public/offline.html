<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Quotes — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem;
      text-align: center;
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.03em; }
    p { font-size: 0.9rem; color: #888; line-height: 1.5; max-width: 280px; }
    button {
      margin-top: 2rem;
      padding: 0.625rem 1.5rem;
      background: #f5f5f5;
      color: #0a0a0a;
      border: none;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #ddd; }
  </style>
</head>
<body>
  <div class="icon">⛈️</div>
  <h1>You're offline</h1>
  <p>Weather data needs a connection. Check your network and try again.</p>
  <button onclick="window.location.reload()">Retry</button>
</body>
</html>
